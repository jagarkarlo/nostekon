name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-api:
    name: Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Report API smoke test
        run: scripts/ci/report-api-smoke.sh

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Validate example drills
        run: nostekon validate examples/drills/*.yaml

  backup-rehearsal:
    name: Real PostgreSQL backup rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Cache explicit test image
        run: docker --host unix:///var/run/docker.sock pull postgres:16.8
      - name: Exercise real dump, isolated restore and independent verdicts
        env:
          NOSTEKON_BACKUP_INTEGRATION: '1'
        run: pytest -q tests/test_backup_restore.py

  app:
    name: Installed app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
      NOSTEKON_PORT: "8180"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Build app image
        run: docker compose build
      - name: Start app
        run: docker compose up -d --no-build
      - name: Install browser tests
        working-directory: studio
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test installed app
        working-directory: studio
        env:
          NOSTEKON_APP_URL: http://127.0.0.1:8180
        run: npm run test:e2e -- --grep 'installed app|portable evidence bundle|suite review gate|suite history|signature trust|app information|run backup|real backup rehearsal|real semantic backup'
      - name: Stop app
        if: always()
        run: docker compose down
      - name: Upload app browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installed-app-playwright-results
          path: studio/test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build

  studio:
    name: Studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - name: Verify public package sources
        run: |
          node -e 'const lock = require("./package-lock.json"); const invalid = Object.values(lock.packages).filter(pkg => pkg.resolved && new URL(pkg.resolved).origin !== "https://registry.npmjs.org"); if (invalid.length) { console.error(`${invalid.length} packages use a non-public registry`); process.exit(1); }'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and verify portable Linux app
        working-directory: .
        env:
          NOSTEKON_APP_TARGETS: linux/amd64
          NOSTEKON_VERSION: ci
        run: |
          bash scripts/build-app.sh "$RUNNER_TEMP/nostekon-app"
          cd "$RUNNER_TEMP/nostekon-app"
          sha256sum --check SHA256SUMS
          mkdir extracted
          tar -xzf nostekon-app_linux_amd64.tar.gz -C extracted
          extracted/nostekon-api --version
      - uses: actions/upload-artifact@v7
        with:
          name: nostekon-app-linux-amd64
          path: ${{ runner.temp }}/nostekon-app/
          retention-days: 7

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '..[docs]'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            studio/package-lock.json
      - name: Verify public package sources
        run: |
          node -e 'const lock = require("./package-lock.json"); const invalid = Object.values(lock.packages).filter(pkg => pkg.resolved && new URL(pkg.resolved).origin !== "https://registry.npmjs.org"); if (invalid.length) { console.error(`${invalid.length} packages use a non-public registry`); process.exit(1); }'
      - run: npm ci
      - run: npm ci --prefix ../studio
      - run: npm run build
      - name: Verify rendered product routes and assets
        working-directory: .
        run: scripts/ci/site-smoke.sh site
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: studio
      - name: Run Studio browser tests
        run: npm run test:e2e
        working-directory: studio
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-playwright-results
          path: studio/test-results/
          if-no-files-found: ignore
          retention-days: 7
