name: Isolated restore lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nostekon-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    name: PostgreSQL V4 restore gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lab tools
        run: |
          python -m pip install -e .
          go install github.com/k3d-io/k3d/v5@v5.8.3
          command -v kubectl
          command -v jq
          docker info >/dev/null
      - name: Create isolated clusters
        run: make lab-up
      - name: Run three-case policy suite
        run: |
          mkdir -p lab-results
          nostekon lab suite --writes 10 --rpo-seconds 60 \
            --output-dir lab-results/suite
      - name: Evaluate V4 evidence
        run: |
          go build -o "$RUNNER_TEMP/nostekon-report" ./cmd/nostekon-report
          "$RUNNER_TEMP/nostekon-report" lab-results/suite/zero-loss.drillrun.json \
            >lab-results/report.json
          jq -e '
            .verdict == "verified" and
            .requestedLevel == "V4" and
            .deepestPassed == "V4" and
            .firstFailed == null and
            .rpo.acknowledged == 10 and
            .rpo.recovered == 10 and
            .rpo.lost == 0 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.seconds == 0 and
            .rpo.met == true and
            (.levels[] | select(.id == "V4") | .checks |
              any(.name == "probe-write-preserved" and .passed == true))
          ' lab-results/report.json >/dev/null
      - name: Verify deliberate acknowledged-write loss
        run: |
          if "$RUNNER_TEMP/nostekon-report" lab-results/suite/tail-loss.drillrun.json \
            >lab-results/tail-loss.report.json; then
            echo "Tail-loss report unexpectedly passed" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          jq -e '
            .verdict == "failed" and
            .requestedLevel == "V4" and
            .deepestPassed == "V3" and
            .firstFailed == "V4" and
            .rpo.acknowledged == 12 and
            .rpo.recovered == 10 and
            .rpo.lost == 2 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.met == false and
            (.levels[] | select(.id == "V4") | .checks |
              any(.source == "ledger" and .passed == false))
          ' lab-results/tail-loss.report.json >/dev/null
      - name: Verify acknowledged-write loss within an explicit RPO budget
        run: |
          "$RUNNER_TEMP/nostekon-report" lab-results/suite/budget-loss.drillrun.json \
            >lab-results/budget-loss.report.json
          jq -e '
            .verdict == "verified" and
            .requestedLevel == "V4" and
            .deepestPassed == "V4" and
            .firstFailed == null and
            .rpo.acknowledged == 12 and
            .rpo.recovered == 10 and
            .rpo.lost == 2 and
            .rpo.holes == 0 and
            .rpo.unexpected == 0 and
            .rpo.consistent == true and
            .rpo.seconds > 0 and
            .rpo.seconds <= 60 and
            .rpo.objectiveSeconds == 60 and
            .rpo.met == true and
            (.levels[] | select(.id == "V4") | .checks |
              any(.source == "ledger" and .passed == true))
          ' lab-results/budget-loss.report.json >/dev/null
      - name: Verify suite summary against Go reports
        run: |
          jq -en \
            --slurpfile suite lab-results/suite/suite.json \
            --slurpfile zero lab-results/report.json \
            --slurpfile tail lab-results/tail-loss.report.json \
            --slurpfile budget lab-results/budget-loss.report.json '
            $suite[0] as $summary |
            [$zero[0], $tail[0], $budget[0]] as $reports |
            $summary.apiVersion == "nostekon/lab-suite/v1alpha1" and
            $summary.kind == "LabSuiteResult" and
            $summary.status == "passed" and
            $summary.passed == true and
            $summary.completedAt != null and
            [$summary.cases[].name] == ["zero-loss", "tail-loss", "budget-loss"] and
            [$summary.cases[].expectedExitCode] == [0, 1, 0] and
            [$summary.cases[].observedExitCode] == [0, 1, 0] and
            all(range(0; 3); . as $index |
              $summary.cases[$index] as $case |
              $reports[$index] as $report |
              $case.passed == true and
              $case.drillRun == ($case.name + ".drillrun.json") and
              $report.verdict == (if $case.expectedExitCode == 0 then "verified" else "failed" end) and
              $case.rpo.acknowledged == $report.rpo.acknowledged and
              $case.rpo.recovered == $report.rpo.recovered and
              $case.rpo.lost == $report.rpo.lost and
              $case.rpo.holes == $report.rpo.holes and
              $case.rpo.unexpected == $report.rpo.unexpected and
              (($case.rpo.seconds - $report.rpo.seconds) | fabs) <= 0.000001 and
              $case.rpo.objectiveSeconds == $report.rpo.objectiveSeconds and
              $case.rpo.met == $report.rpo.met
            )
          ' >/dev/null
      - name: Write independent suite review
        if: always()
        run: |
          mkdir -p lab-results
          go build -o "$RUNNER_TEMP/nostekon-report" ./cmd/nostekon-report
          "$RUNNER_TEMP/nostekon-report" --suite lab-results/suite \
            >lab-results/suite-review.json
      - name: Remove disposable clusters
        if: always()
        run: |
          if command -v k3d >/dev/null; then
            make lab-down
          fi
      - name: Upload lab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab-results/
          if-no-files-found: ignore
          retention-days: 7