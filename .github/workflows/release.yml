name: Release

# A v* tag builds every artifact and creates a GitHub pre-release. Publishing to
# PyPI is public and irreversible, so it only runs from a manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Nostekon release tag to rebuild, for example v0.1.1"
        required: true
        type: string
      publish-pypi:
        description: "Also publish the Python package to PyPI (public, irreversible)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Require a Nostekon release tag
        shell: bash
        run: |
          if [[ ! -f src/nostekon/__init__.py ]]; then
            printf '%s\n' 'This tag predates Nostekon. Create a new release tag; do not republish the historical release.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Python distributions
        run: |
          python -m pip install build
          python -m build --outdir release/
      - name: Go binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            for cmd in nostekon-api nostekon-report nostekon-attest; do
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "release/${cmd}_${os}_${arch}${ext}" "./cmd/$cmd"
            done
          done
      - name: Studio and installable app bundles
        env:
          NOSTEKON_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          npm ci --prefix studio
          npm run build --prefix studio
          tar -czf release/nostekon-studio.tar.gz -C studio/dist .
          bash scripts/build-app.sh release/
      - name: Checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  github-release:
    name: GitHub pre-release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          title="Nostekon $TAG - installable evidence app"
          body='Nostekon pre-alpha portable app: extract the matching nostekon-app archive, run start-nostekon.sh (Unix) or Start-Nostekon.cmd (Windows), and open http://127.0.0.1:8080. Studio is discovered beside the binary; --addr changes the port and --version identifies the build. Windows packages are ZIPs. The app includes V0-V4 evaluation, RTO/RPO policy-suite review, exact original evidence, attached sidecars, explicit local public-key trust and signed archive transfer, plus report/Ed25519 CLIs. Lab execution is disabled by default; only an explicit Linux host opt-in can run the fixed isolated policy suite with persistent job history. Browser run storage is local to its origin, not shared server storage. General recovery orchestration and authenticated multi-user deployment remain planned. Verify SHA256SUMS before running. This release does not publish to PyPI.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$body" --prerelease
          fi

  publish:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish-pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nostekon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release/
      - name: Select Python distributions
        run: mkdir dist && cp release/nostekon-*.whl release/nostekon-[0-9]*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
